# nixpacks.toml

providers = ["php"]

[phases.setup]
nixPkgs = [
  "php",
  "phpPackages.composer",
  "libpng",
  "libjpeg",
  "freetype",
  "libzip",
  "libxml2",
  "curl",
  "libsodium",
  "oniguruma"
]
phpExtensions = [
  "gd",
  "pdo_mysql",
  "mbstring",
  "xml",
  "bcmath",
  "zip",
  "opcache",
  "sodium",
  "intl",
  "curl",
  "exif"
]

[phases.build]
cmds = ["composer install --no-dev --no-interaction --optimize-autoloader"]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
