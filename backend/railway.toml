"$schema" = "https://railway.app/railway.schema.json"

[build]
builder = "NIXPACKS"
buildCommand = "composer install --no-dev --no-interaction --optimize-autoloader"

[deploy]
startCommand = "mkdir -p storage/app/public storage/framework/cache storage/framework/sessions storage/framework/views storage/logs && php artisan storage:link --force && php artisan serve --host=0.0.0.0 --port=$PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
