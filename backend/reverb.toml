"$schema" = "https://railway.app/railway.schema.json"

# REVERB WebSocket service — serves the in-app realtime notifications.
# IMPORTANT: In the Railway dashboard, set this service's ROOT DIRECTORY to `backend`
# (same as the web service) and point its CONFIG FILE at `/backend/reverb.toml`.
# Builder = DOCKERFILE (uses `backend/Dockerfile` which runs `php artisan reverb:start`).

[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "php artisan reverb:start --host=0.0.0.0 --port=${REVERB_SERVER_PORT:-8080}"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3