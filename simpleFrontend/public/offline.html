<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انت غير متصل بالانترنت | أجي نقصرو</title>
  <meta name="theme-color" content="#0F3D2E">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #0F3D2E;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: #14221C;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 40px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .icon-wrapper {
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: rgba(217, 164, 65, 0.15);
      border: 2px solid rgba(217, 164, 65, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #D9A441;
      animation: pulse 2.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.85; }
    }
    h1 {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 12px;
      color: #FFFFFF;
      letter-spacing: -0.3px;
    }
    p {
      color: #F1F5F9;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      background: #1F7A4D;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 800;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px rgba(31, 122, 77, 0.35);
      text-decoration: none;
    }
    .btn-retry:hover {
      background: #196740;
      transform: translateY(-2px);
    }
    .btn-retry:active {
      transform: scale(0.98);
    }
    .brand-tag {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 800;
      color: #A7F3D0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-wrapper">
      <!-- Wifi Off SVG -->
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" y1="2" x2="22" y2="22"></line>
        <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65"></path>
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.82"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1>انت غير متصل بالانترنت</h1>
    <p>الموقع لا يعمل ب *6 يا صديقي</p>

    <button type="button" class="btn-retry" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      عاود المحاولة
    </button>

    <div class="brand-tag">
      <span>⚽ أجي نقصرو — الكورة كتجمعنا</span>
    </div>
  </div>
</body>
</html>
